<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DigiLocker QA · Test Reports</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@300;400;600;700&family=Source+Code+Pro:wght@400;600&display=swap" rel="stylesheet" />
  <link href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet">
  <style>
    /* ─── Extent Spark color palette ─── */
    :root {
      --nav-bg:       #2c3e6b;   /* dark navy sidebar */
      --nav-dark:     #1e2d52;   /* deeper navy */
      --accent:       #3c8dbc;   /* Spark primary blue */
      --accent-light: #5ba4d0;
      --pass:         #00c292;   /* Spark success teal-green */
      --fail:         #fb9678;   /* Spark danger orange-red */
      --skip:         #fec107;   /* Spark warning amber */
      --bg:           #f4f6fb;   /* page background */
      --surface:      #ffffff;
      --surface2:     #f0f4fa;
      --border:       #dde3ef;
      --text:         #2c3e50;
      --muted:        #8a97b0;
      --header-h:     60px;
      --sans:         'Nunito Sans', sans-serif;
      --mono:         'Source Code Pro', monospace;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      min-height: 100vh;
    }

    /* ─────────────── HEADER (Spark navbar) ─────────────── */
    header {
      background: var(--nav-bg);
      height: var(--header-h);
      display: flex;
      align-items: center;
      padding: 0 2rem;
      position: sticky; top: 0; z-index: 200;
      box-shadow: 0 2px 8px rgba(0,0,0,0.25);
    }

    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      max-width: 1280px;
      margin: 0 auto;
    }

    .logo-block {
      display: flex;
      align-items: center;
      gap: 0.85rem;
    }

    .logo-icon {
      width: 36px; height: 36px;
      background: linear-gradient(135deg, var(--accent), #2980b9);
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      font-family: var(--mono);
      font-weight: 600; font-size: 0.8rem;
      color: #fff;
      flex-shrink: 0;
      letter-spacing: -0.5px;
    }

    .logo-text { line-height: 1.3; }
    .logo-text .org   { display: block; font-size: 0.62rem; color: rgba(255,255,255,0.55); letter-spacing: 0.14em; text-transform: uppercase; }
    .logo-text .title { display: block; font-size: 0.92rem; font-weight: 700; color: #fff; }

    .header-pills {
      display: flex; gap: 0.5rem; align-items: center;
    }

    .h-pill {
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 20px;
      padding: 0.25rem 0.75rem;
      font-size: 0.72rem;
      color: rgba(255,255,255,0.85);
      font-family: var(--mono);
      white-space: nowrap;
    }

    .h-pill.accent { background: var(--accent); border-color: var(--accent); color: #fff; }

    /* ─────────────── LAYOUT ─────────────── */
    .layout {
      max-width: 1280px;
      margin: 0 auto;
      padding: 2rem 2rem 4rem;
    }

    /* ─────────────── LATEST RUN BANNER ─────────────── */
    .latest-banner {
      background: var(--nav-bg);
      border-radius: 12px;
      padding: 1.5rem 2rem;
      margin-bottom: 1.75rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1.5rem;
      flex-wrap: wrap;
      box-shadow: 0 4px 16px rgba(44,62,107,0.18);
    }

    .latest-left { display: flex; flex-direction: column; gap: 0.3rem; }
    .latest-eyebrow {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: rgba(255,255,255,0.5);
      font-family: var(--mono);
    }

    .latest-date {
      font-size: 1.4rem;
      font-weight: 700;
      color: #fff;
      line-height: 1.2;
    }

    .latest-sub {
      font-size: 0.78rem;
      color: rgba(255,255,255,0.55);
    }

    .latest-stats {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .ls-card {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 8px;
      padding: 0.65rem 1.1rem;
      text-align: center;
      min-width: 80px;
    }

    .ls-card .lsc-num {
      font-family: var(--mono);
      font-size: 1.55rem;
      font-weight: 600;
      line-height: 1;
    }

    .ls-card .lsc-label {
      font-size: 0.62rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: rgba(255,255,255,0.55);
      margin-top: 0.25rem;
    }

    .ls-card.total .lsc-num { color: rgba(255,255,255,0.95); }
    .ls-card.pass  .lsc-num { color: var(--pass); }
    .ls-card.fail  .lsc-num { color: var(--fail); }
    .ls-card.skip  .lsc-num { color: var(--skip); }

    .latest-open-btn {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 0.65rem 1.4rem;
      font-family: var(--sans);
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      white-space: nowrap;
      transition: background 0.18s;
      flex-shrink: 0;
    }

    .latest-open-btn:hover { background: var(--accent-light); }

    /* ─────────────── FILTERS PANEL ─────────────── */
    .filter-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.1rem 1.5rem;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
      box-shadow: 0 1px 4px rgba(0,0,0,0.05);
    }

    .fp-group {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .fp-label {
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--muted);
      font-family: var(--mono);
      white-space: nowrap;
    }

    .fp-select {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-family: var(--sans);
      font-size: 0.82rem;
      padding: 0.35rem 0.75rem;
      cursor: pointer;
      outline: none;
      transition: border-color 0.18s;
      min-width: 100px;
    }

    .fp-select:focus { border-color: var(--accent); }

    .fp-divider {
      width: 1px; height: 28px;
      background: var(--border);
      flex-shrink: 0;
    }

    /* Sort */
    .sort-group {
      display: flex;
      gap: 0.3rem;
      margin-left: auto;
    }

    .sort-btn {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--muted);
      font-family: var(--sans);
      font-size: 0.78rem;
      padding: 0.35rem 0.85rem;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }

    .sort-btn:hover { border-color: var(--accent); color: var(--accent); }
    .sort-btn.active { background: var(--nav-bg); border-color: var(--nav-bg); color: #fff; }

    /* Clear filters */
    #clear-btn {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--muted);
      font-family: var(--sans);
      font-size: 0.75rem;
      padding: 0.35rem 0.75rem;
      cursor: pointer;
      display: none;
      transition: all 0.15s;
      gap: 0.3rem;
      align-items: center;
    }

    #clear-btn.show { display: inline-flex; }
    #clear-btn:hover { border-color: var(--fail); color: var(--fail); }

    /* ─────────────── REPORT TABLE HEADER ─────────────── */
    .list-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.65rem;
      padding: 0 0.25rem;
    }

    .list-title {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--muted);
      font-family: var(--mono);
    }

    #count-badge {
      background: var(--nav-bg);
      color: #fff;
      border-radius: 20px;
      font-family: var(--mono);
      font-size: 0.68rem;
      padding: 0.15rem 0.65rem;
    }

    /* ─────────────── REPORT CARDS ─────────────── */
    .report-list {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .report-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 4px solid transparent;
      border-radius: 8px;
      display: grid;
      grid-template-columns: 72px 1px 1fr auto;
      align-items: center;
      gap: 0;
      text-decoration: none;
      color: inherit;
      transition: border-color 0.18s, box-shadow 0.18s, transform 0.15s;
      overflow: hidden;
      animation: fadeUp 0.25s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .report-card:hover {
      border-left-color: var(--accent);
      box-shadow: 0 4px 16px rgba(44,62,107,0.1);
      transform: translateX(2px);
    }

    /* date column */
    .card-date {
      padding: 1.1rem 0;
      text-align: center;
      background: var(--surface2);
      height: 100%;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      flex-shrink: 0;
    }

    .card-day {
      font-family: var(--mono);
      font-size: 1.55rem;
      font-weight: 700;
      color: var(--nav-bg);
      line-height: 1;
    }

    .card-mon {
      font-family: var(--mono);
      font-size: 0.62rem;
      text-transform: uppercase;
      color: var(--muted);
      letter-spacing: 0.08em;
    }

    .card-yr {
      font-size: 0.58rem;
      color: #c0c8d8;
      font-family: var(--mono);
    }

    /* sep */
    .card-sep {
      width: 1px;
      background: var(--border);
      align-self: stretch;
    }

    /* body */
    .card-body {
      padding: 0.9rem 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
    }

    .card-title {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text);
    }

    .badge-row {
      display: flex;
      gap: 0.45rem;
      flex-wrap: wrap;
      align-items: center;
    }

    .badge {
      font-family: var(--mono);
      font-size: 0.67rem;
      font-weight: 600;
      padding: 0.18rem 0.55rem;
      border-radius: 4px;
    }

    .badge-pass { background: rgba(0,194,146,0.12); color: #00a97e; }
    .badge-fail { background: rgba(251,150,120,0.15); color: #e05c2e; }
    .badge-skip { background: rgba(254,193,7,0.15);  color: #c68f00; }

    .prog-track {
      height: 5px;
      background: var(--border);
      border-radius: 3px;
      overflow: hidden;
      display: flex;
      width: 200px;
      max-width: 100%;
    }

    .prog-pass { background: var(--pass);   height: 100%; }
    .prog-fail { background: var(--fail);   height: 100%; }
    .prog-skip { background: var(--skip);   height: 100%; }

    /* cta */
    .card-cta {
      padding: 0 1.25rem 0 0.5rem;
      display: flex;
      align-items: center;
    }

    .cta-icon {
      width: 32px; height: 32px;
      background: var(--surface2);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      color: var(--muted);
      font-size: 0.85rem;
      transition: background 0.18s, color 0.18s;
    }

    .report-card:hover .cta-icon {
      background: var(--accent);
      color: #fff;
    }

    /* ─────────────── EMPTY STATE ─────────────── */
    .empty-state {
      display: none;
      text-align: center;
      padding: 4rem 2rem;
      color: var(--muted);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    .empty-state i { font-size: 2.5rem; opacity: 0.3; display: block; margin-bottom: 1rem; }
    .empty-state p { font-family: var(--mono); font-size: 0.82rem; }

    /* ─────────────── PAGINATION ─────────────── */
    .pagination-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 1.25rem;
      flex-wrap: wrap;
      gap: 0.75rem;
    }

    .pg-info {
      font-family: var(--mono);
      font-size: 0.72rem;
      color: var(--muted);
    }

    .pg-info span { color: var(--accent); }

    .pg-controls {
      display: flex;
      gap: 0.3rem;
      align-items: center;
    }

    .pg-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-family: var(--mono);
      font-size: 0.75rem;
      width: 34px; height: 34px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: all 0.15s;
    }

    .pg-btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
    .pg-btn.current { background: var(--nav-bg); border-color: var(--nav-bg); color: #fff; }
    .pg-btn:disabled { opacity: 0.35; cursor: default; }

    .pg-per-page {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .pg-per-page select {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-family: var(--sans);
      font-size: 0.78rem;
      padding: 0.3rem 0.5rem;
      cursor: pointer;
    }

    /* ─────────────── FOOTER ─────────────── */
    footer {
      background: var(--nav-dark);
      padding: 1.25rem 2rem;
      text-align: center;
      font-family: var(--mono);
      font-size: 0.68rem;
      color: rgba(255,255,255,0.35);
      margin-top: 2rem;
    }

    footer span { color: rgba(255,255,255,0.6); }

    /* ─────────────── RESPONSIVE ─────────────── */
    @media (max-width: 640px) {
      .report-card { grid-template-columns: 0 0 1fr auto; }
      .card-date, .card-sep { display: none; }
      .filter-panel { gap: 0.6rem; }
      .sort-group { margin-left: 0; }
      .latest-banner { flex-direction: column; align-items: flex-start; }
      .header-pills { display: none; }
    }
  </style>
</head>
<body>

<!-- ═══ HEADER ═══ -->
<header>
  <div class="header-inner">
    <div class="logo-block">
      <div class="logo-icon">DL</div>
      <div class="logo-text">
        <span class="org">DigiLocker</span>
        <span class="title">QA Report Portal</span>
      </div>
    </div>
    <div class="header-pills">
      <span class="h-pill"><i class="fa fa-cog"></i> Selenium</span>
      <span class="h-pill accent"><i class="fa fa-flask"></i> Extent Reports</span>
      <span class="h-pill" id="h-total-runs">— runs</span>
    </div>
  </div>
</header>

<!-- ═══ MAIN ═══ -->
<div class="layout">

  <!-- Latest run banner -->
  <div class="latest-banner">
    <div class="latest-left">
      <span class="latest-eyebrow"><i class="fa fa-circle" style="color:var(--pass);font-size:0.55rem"></i>&nbsp; Latest Run</span>
      <div class="latest-date" id="lb-date">—</div>
      <div class="latest-sub" id="lb-sub">Loading…</div>
    </div>
    <div class="latest-stats">
      <div class="ls-card total"><div class="lsc-num" id="lb-total">—</div><div class="lsc-label">Total</div></div>
      <div class="ls-card pass"> <div class="lsc-num" id="lb-pass">—</div> <div class="lsc-label">Pass</div></div>
      <div class="ls-card fail"> <div class="lsc-num" id="lb-fail">—</div> <div class="lsc-label">Fail</div></div>
      <div class="ls-card skip"> <div class="lsc-num" id="lb-skip">—</div> <div class="lsc-label">Skip</div></div>
    </div>
    <a class="latest-open-btn" id="lb-link" href="#" target="_blank">
      <i class="fa fa-external-link"></i> Open Report
    </a>
  </div>

  <!-- Filter panel -->
  <div class="filter-panel">
    <!-- Year -->
    <div class="fp-group">
      <span class="fp-label"><i class="fa fa-calendar"></i> Year</span>
      <select class="fp-select" id="f-year">
        <option value="">All</option>
      </select>
    </div>

    <div class="fp-divider"></div>

    <!-- Month -->
    <div class="fp-group">
      <span class="fp-label">Month</span>
      <select class="fp-select" id="f-month">
        <option value="">All</option>
      </select>
    </div>

    <div class="fp-divider"></div>

    <!-- Date (day of month) -->
    <div class="fp-group">
      <span class="fp-label">Date</span>
      <select class="fp-select" id="f-day">
        <option value="">All</option>
      </select>
    </div>

    <button id="clear-btn" onclick="clearFilters()">
      <i class="fa fa-times"></i> Clear
    </button>

    <!-- Sort -->
    <div class="sort-group">
      <span class="fp-label" style="margin-right:0.15rem"><i class="fa fa-sort"></i></span>
      <button class="sort-btn active" id="sb-newest"   onclick="setSort('newest')">Newest</button>
      <button class="sort-btn"        id="sb-oldest"   onclick="setSort('oldest')">Oldest</button>
      <button class="sort-btn"        id="sb-passrate" onclick="setSort('passrate')">Pass%</button>
    </div>
  </div>

  <!-- List header -->
  <div class="list-header">
    <span class="list-title"><i class="fa fa-list"></i>&nbsp; Reports</span>
    <div style="display:flex;align-items:center;gap:0.75rem">
      <div class="pg-per-page">
        <span style="font-size:0.72rem;color:var(--muted);font-family:var(--mono)">Per page</span>
        <select id="per-page-sel" onchange="setPerPage(this.value)">
          <option value="5">5</option>
          <option value="10" selected>10</option>
          <option value="20">20</option>
          <option value="50">50</option>
        </select>
      </div>
      <span id="count-badge">0</span>
    </div>
  </div>

  <!-- Report list -->
  <div class="report-list" id="report-list"></div>

  <!-- Empty state -->
  <div class="empty-state" id="empty-state">
    <i class="fa fa-search"></i>
    <p>No reports match the selected filters.</p>
  </div>

  <!-- Pagination -->
  <div class="pagination-bar" id="pg-bar">
    <div class="pg-info">
      Showing <span id="pg-from">—</span>–<span id="pg-to">—</span> of <span id="pg-of">—</span> reports
    </div>
    <div class="pg-controls" id="pg-controls"></div>
  </div>

</div><!-- /.layout -->

<footer>
  <span>DigiLocker QA Portal</span> · GitHub + Netlify · Selenium &amp; Extent Reports
</footer>

<script>
  /* ─── State ─── */
  let allReports = [];
  let filtered   = [];
  let sortMode   = 'newest';
  let page       = 1;
  let perPage    = 10;

  const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const MONTH_FULL = ['January','February','March','April','May','June','July','August','September','October','November','December'];

  /* ─── Init ─── */
  async function init() {
    try {
      const res = await fetch('reports.json');
      allReports = await res.json();
    } catch (e) {
      document.getElementById('report-list').innerHTML =
        '<p style="padding:2rem;font-family:var(--mono);color:var(--muted);font-size:0.82rem">⚠ Could not load reports.json</p>';
      return;
    }

    // Populate filter dropdowns from data
    buildFilterOptions();

    // Attach change listeners
    ['f-year','f-month','f-day'].forEach(id => {
      document.getElementById(id).addEventListener('change', () => { page = 1; applyAndRender(); });
    });

    // Latest banner
    const sorted = [...allReports].sort((a,b) => new Date(b.date) - new Date(a.date));
    const latest = sorted[0];
    if (latest) {
      const d = parseDate(latest.date);
      document.getElementById('lb-date').textContent  = d.toLocaleDateString('en-IN', { weekday:'long', year:'numeric', month:'long', day:'numeric' });
      document.getElementById('lb-sub').textContent   = `Run on ${latest.label} · ${Math.round(latest.pass/(latest.pass+latest.fail+latest.skip)*100)}% pass rate`;
      document.getElementById('lb-total').textContent = latest.pass + latest.fail + latest.skip;
      document.getElementById('lb-pass').textContent  = latest.pass;
      document.getElementById('lb-fail').textContent  = latest.fail;
      document.getElementById('lb-skip').textContent  = latest.skip;
      document.getElementById('lb-link').href         = latest.path;
    }

    document.getElementById('h-total-runs').textContent = allReports.length + ' runs';

    applyAndRender();
  }

  /* ─── Build filter <option> lists ─── */
  function buildFilterOptions() {
    const years  = [...new Set(allReports.map(r => r.date.slice(0,4)))].sort((a,b)=>b-a);
    const months = [...new Set(allReports.map(r => +r.date.slice(5,7)))].sort((a,b)=>a-b);
    const days   = [...new Set(allReports.map(r => +r.date.slice(8,10)))].sort((a,b)=>a-b);

    const yEl = document.getElementById('f-year');
    years.forEach(y => { const o = document.createElement('option'); o.value=y; o.textContent=y; yEl.appendChild(o); });

    const mEl = document.getElementById('f-month');
    months.forEach(m => { const o = document.createElement('option'); o.value=m; o.textContent=MONTH_FULL[m-1]; mEl.appendChild(o); });

    const dEl = document.getElementById('f-day');
    days.forEach(d => { const o = document.createElement('option'); o.value=d; o.textContent=d; dEl.appendChild(o); });
  }

  /* ─── Filter + sort + paginate ─── */
  function applyAndRender() {
    const fYear  = document.getElementById('f-year').value;
    const fMonth = document.getElementById('f-month').value;
    const fDay   = document.getElementById('f-day').value;

    // Show/hide clear button
    const hasFilter = fYear || fMonth || fDay;
    document.getElementById('clear-btn').classList.toggle('show', !!hasFilter);

    filtered = allReports.filter(r => {
      const [y, m, d] = r.date.split('-');
      if (fYear  && y !== fYear)           return false;
      if (fMonth && +m !== +fMonth)        return false;
      if (fDay   && +d !== +fDay)          return false;
      return true;
    });

    // Sort
    if (sortMode === 'newest')   filtered.sort((a,b) => new Date(b.date) - new Date(a.date));
    if (sortMode === 'oldest')   filtered.sort((a,b) => new Date(a.date) - new Date(b.date));
    if (sortMode === 'passrate') {
      filtered.sort((a,b) => {
        const pa = a.pass / (a.pass+a.fail+a.skip);
        const pb = b.pass / (b.pass+b.fail+b.skip);
        return pb - pa;
      });
    }

    document.getElementById('count-badge').textContent = filtered.length + ' report' + (filtered.length !== 1 ? 's' : '');

    renderPage();
    renderPagination();
  }

  /* ─── Render current page ─── */
  function renderPage() {
    const start = (page - 1) * perPage;
    const end   = Math.min(start + perPage, filtered.length);
    const slice = filtered.slice(start, end);

    const list  = document.getElementById('report-list');
    const empty = document.getElementById('empty-state');

    if (filtered.length === 0) {
      list.innerHTML = '';
      empty.style.display = 'block';
    } else {
      empty.style.display = 'none';
      list.innerHTML = slice.map((r, i) => buildCard(r, i)).join('');
    }

    document.getElementById('pg-from').textContent = filtered.length ? start + 1 : 0;
    document.getElementById('pg-to').textContent   = end;
    document.getElementById('pg-of').textContent   = filtered.length;
  }

  /* ─── Build a card ─── */
  function buildCard(r, i) {
    const d    = parseDate(r.date);
    const day  = d.getDate().toString().padStart(2,'0');
    const mon  = MONTHS[d.getMonth()];
    const yr   = d.getFullYear();
    const wd   = d.toLocaleString('en', {weekday:'long'});
    const tot  = r.pass + r.fail + r.skip;
    const pp   = Math.round(r.pass / tot * 100);
    const fp   = Math.round(r.fail / tot * 100);
    const sp   = 100 - pp - fp;

    return `
      <a href="${r.path}" target="_blank" class="report-card" style="animation-delay:${i*0.04}s">
        <div class="card-date">
          <div class="card-day">${day}</div>
          <div class="card-mon">${mon}</div>
          <div class="card-yr">${yr}</div>
        </div>
        <div class="card-sep"></div>
        <div class="card-body">
          <div class="card-title">${wd}, ${mon} ${day} ${yr}</div>
          <div class="badge-row">
            <span class="badge badge-pass"><i class="fa fa-check"></i> ${r.pass} Passed</span>
            <span class="badge badge-fail"><i class="fa fa-times"></i> ${r.fail} Failed</span>
            <span class="badge badge-skip"><i class="fa fa-minus"></i> ${r.skip} Skipped</span>
            <span style="font-family:var(--mono);font-size:0.65rem;color:var(--muted)">${pp}% pass rate</span>
          </div>
          <div class="prog-track">
            <div class="prog-pass" style="width:${pp}%"></div>
            <div class="prog-fail" style="width:${fp}%"></div>
            <div class="prog-skip" style="width:${sp}%"></div>
          </div>
        </div>
        <div class="card-cta">
          <div class="cta-icon"><i class="fa fa-external-link"></i></div>
        </div>
      </a>`;
  }

  /* ─── Pagination controls ─── */
  function renderPagination() {
    const totalPages = Math.ceil(filtered.length / perPage);
    const bar = document.getElementById('pg-controls');

    if (totalPages <= 1) { bar.innerHTML = ''; return; }

    // clamp page
    if (page > totalPages) page = totalPages;

    let html = `<button class="pg-btn" onclick="gotoPage(${page-1})" ${page===1?'disabled':''}><i class="fa fa-chevron-left"></i></button>`;

    // smart page numbers: always show first, last, current ±1
    const pages = new Set([1, totalPages, page, page-1, page+1].filter(p => p>=1 && p<=totalPages));
    let prev = null;
    for (const p of [...pages].sort((a,b)=>a-b)) {
      if (prev !== null && p - prev > 1) html += `<span style="color:var(--muted);padding:0 0.2rem;font-size:0.8rem">…</span>`;
      html += `<button class="pg-btn ${p===page?'current':''}" onclick="gotoPage(${p})">${p}</button>`;
      prev = p;
    }

    html += `<button class="pg-btn" onclick="gotoPage(${page+1})" ${page===totalPages?'disabled':''}><i class="fa fa-chevron-right"></i></button>`;
    bar.innerHTML = html;
  }

  /* ─── Helpers ─── */
  function gotoPage(p) {
    page = p;
    renderPage();
    renderPagination();
    window.scrollTo({top: 0, behavior: 'smooth'});
  }

  function setPerPage(v) {
    perPage = parseInt(v);
    page = 1;
    renderPage();
    renderPagination();
  }

  function setSort(mode) {
    sortMode = mode;
    page = 1;
    document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('sb-' + mode).classList.add('active');
    applyAndRender();
  }

  function clearFilters() {
    ['f-year','f-month','f-day'].forEach(id => { document.getElementById(id).value = ''; });
    page = 1;
    applyAndRender();
  }

  function parseDate(str) {
    // Parse YYYY-MM-DD without timezone shift
    const [y, m, d] = str.split('-').map(Number);
    return new Date(y, m-1, d);
  }

  init();
</script>
</body>
</html>
